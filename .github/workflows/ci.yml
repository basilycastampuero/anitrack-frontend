name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22 (LTS). Node 20 llegó a fin de vida en abril de 2026 y ya no
          # recibe parches. Se deja un escalón por debajo del Node local (24)
          # a propósito: si alguien usa una API que solo existe en la versión
          # más nueva, conviene que lo avise la CI y no el día del deploy.
          # Esta versión tiene que seguir coincidiendo con .nvmrc.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test
