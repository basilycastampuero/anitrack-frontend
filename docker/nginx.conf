# Sirve el SPA build. try_files hace el fallback a index.html para que
# React Router (createBrowserRouter) resuelva rutas como /catalog, /my-lists,
# etc. directamente al refrescar o entrar por URL profunda.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
